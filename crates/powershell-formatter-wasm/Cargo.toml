[package]
name                   = "powershell-formatter-wasm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "wasm-bindgen bindings for powershell-formatter (browser/Node package)"
repository.workspace   = true
license.workspace      = true
# Not a library: ships as the wasm inside packages/formatter on npm.
publish                = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
powershell-formatter.path = "../powershell-formatter"

serde.workspace              = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace       = true

[lints]
workspace = true
