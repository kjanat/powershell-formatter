# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo-level overrides; everything else is inherited from the org config.
---
inheritance: true
reviews:
  # Generated and vendored files. None of these are hand-written, so reviewing them costs
  # file budget without ever producing a useful comment:
  # they are regenerated by scripts and diffed byte-for-byte by CI instead.
  path_filters:
    # Invoke-Formatter output, regenerated by tests/pssa-parity/generate.ps1.
    - "!tests/pssa-parity/expected/**"
    # pwsh token dumps, regenerated by tests/powershell-oracle/generate.ps1.
    - "!tests/powershell-oracle/fixtures/**"
    # Command/parameter casing table dumped from a live pwsh session.
    - "!tests/pssa-parity/catalog.json"
    # Third-party PowerShell sources vendored verbatim as formatting corpus.
    - "!tests/corpus/files/**"
    - "!tests/powershell-oracle/inputs/upstream-*.ps1"
    # schemars output, drift-checked by the schema-drift CI job.
    - "!crates/dprint-plugin-pwsh/deployment/schema.json"
    # Proptest's own failure-seed ledger.
    - "!crates/pwsh-formatter/tests/properties.proptest-regressions"
    - "!**/dist/**"
    - "!fuzz/corpus/**"

  path_instructions:
    - path: crates/pwsh-parser/src/**
      instructions: >-
        This scanner deliberately mirrors PowerShell's own parser-driven
        tokenizer, including behaviour that looks wrong in isolation
        (mode-dependent number termination, generic-token rescans, `--%`
        verbatim arguments). Every rule was derived by probing pwsh and is
        pinned by
        differential fixtures. Do not propose changes based on what the language
        documentation says the tokenizer should do; flag a divergence only when
        you can point at a fixture or a concrete input where we disagree with
        pwsh itself.
    - path: crates/pwsh-formatter/src/**
      instructions: >-
        Formatting behaviour targets the *shipped* PSScriptAnalyzer 1.25.0
        binary, which differs from PSScriptAnalyzer's master sources in several
        rules. Deviations from upstream source code are intentional and
        documented in docs/pssa-quirks.md. Prioritise correctness,
        content-preservation and idempotence over style: any suggestion that
        could move a comment or string token, or make a second format pass
        produce different output, is a defect no matter how much it tidies the
        code.
    - path: tests/**/generate*.ps1
      instructions: >-
        These scripts regenerate committed oracle fixtures from a live pwsh and
        PSScriptAnalyzer. Changing them invalidates the fixtures they produce,
        so treat any behavioural change here as requiring a fixture
        regeneration in the same change.
