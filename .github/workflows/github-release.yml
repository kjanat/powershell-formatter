# A GitHub release on this repository for every release tag — the
# human-readable changelog anchor. Artifacts live on their own channels
# (mirror release, npm, crates.io; see release.yml); this one carries the
# generated notes. The manual trigger backfills a release for a tag that
# predates this workflow.
---
name: GitHub release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to backfill a release for (e.g. 0.0.0)
        required: true
        type: string
permissions: { contents: write }
defaults: { run: { shell: bash } }

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: gh release create ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; leaving it untouched (immutable)"
            exit 0
          fi
          gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" \
            --title "${TAG}" --verify-tag --generate-notes
