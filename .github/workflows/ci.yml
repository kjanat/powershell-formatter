---
name: CI
on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "**/LICENSE", "docs/**", .coderabbit.yaml, .editorconfig]
  pull_request:
    paths-ignore: ["**/*.md", "**/LICENSE", "docs/**", .coderabbit.yaml, .editorconfig]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: { contents: read }
env: { CARGO_TERM_COLOR: always }
defaults: { run: { shell: bash } }

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: kjanat/install-dprint@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest,tombi" }
      - run: make fmt-check
      - run: make lint
      - run: make rust-test

  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make schema-check

  wasm:
    name: wasm builds + dprint e2e + node package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version-file: .node-version }
      - uses: kjanat/install-dprint@v2
      - name: Get wasm-bindgen-cli version
        run: bindgen="$(yq '.workspace.dependencies.wasm-bindgen' Cargo.toml)"; echo "bindgen=${bindgen#=}" >> "${GITHUB_ENV}"
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen-cli@${{ env.bindgen }},tombi" }
      - name: dprint plugin end-to-end
        run: make dprint-e2e
      - name: Install npm workspace
        run: make install
      - name: Build and test npm workspaces
        run: make npm-check
      - name: Verify the JSR publish (file set, ESM rules, slow types)
        run: make jsr-check
      - name: Report artifact sizes and enforce budget
        run: |
          set -euo pipefail
          plugin='target/wasm32-unknown-unknown/wasm-release/dprint_plugin_pwsh.wasm'
          browser='packages/formatter/dist/pwsh_formatter_wasm_bg.wasm'
          for f in "${plugin}" "${browser}"; do
            raw="$(stat -c%s "${f}")"
            gz="$(gzip -9 -c "${f}" | wc -c)"
            echo "${f}: raw=${raw} gzip=${gz}"
            # Budget: hard-fail if a change balloons the artifact past 1 MB raw.
            if [[ "${raw}" -gt 1048576 ]]; then
              echo "size budget exceeded for ${f}" >&2
              exit 1
            fi
          done

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include: [
          { target: lexer, seconds: 30 },
          { target: parser, seconds: 30 },
          { target: formatter, seconds: 60 },
        ]
    runs-on: ubuntu-latest
    env: { target: "${{ matrix.target }}", seconds: "${{ matrix.seconds }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: ".\nfuzz" }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      - name: Seed fuzz corpus from the real-world corpus
        run: |
          mkdir -p "fuzz/corpus/${target}"
          for f in tests/corpus/files/*.ps1 tests/powershell-oracle/inputs/*.ps1; do
            # Include the source directory in the seed name: both corpus
            # directories contain overlapping basenames.
            b="$(tr '/' '_' <<<"${f%.ps1}")"
            cp "${f}" "fuzz/corpus/${target}/${b}"
          done
          # Synthetic deep-nesting seed: depth is heap-bounded in the parser, and the
          # real-world corpus never nests past a few dozen levels — keep the fuzzer
          # exploring depth anyway.
          { printf '(%.0s' $(seq 4096); printf '1'; printf ')%.0s' $(seq 4096); } \
            > "fuzz/corpus/${target}/deep-nesting"
      - name: Short fuzz pass
        run: |
          echo "Running fuzz target '${target}' for ${seconds} seconds"
          echo "::group::${target}"
          # Prebuilt cargo-fuzz is a musl binary and defaults the fuzz
          # target triple to its own; sanitizers refuse static libc, so
          # pin the build to the toolchain's host triple.
          make fuzz-smoke FUZZ_TARGET="${target}" FUZZ_SECONDS="${seconds}"
          echo "::endgroup::"

  powershell-oracles:
    name: PowerShell + PSScriptAnalyzer oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - name: Install the pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          # Install exactly the build the committed expectations were generated with,
          # so parity fixtures cannot drift under us when upstream ships a release.
          $version = (Get-Content tests/pssa-parity/expected/VERSION -Raw).Trim()
          Write-Host "pinned PSScriptAnalyzer: ${version}; PowerShell: $($PSVersionTable.PSVersion)"
          Install-Module PSScriptAnalyzer -RequiredVersion $version -Force -Scope CurrentUser
      - name: Regenerate oracle fixtures with this runner's PowerShell
        run: make oracles
      - name: Differential tests against freshly generated fixtures
        run: make oracle-test
      - name: Fail if committed fixtures drifted from the pinned versions
        run: |
          git diff --exit-code --stat -- \
            tests/powershell-oracle/fixtures tests/pssa-parity/expected \
            ':(exclude)tests/powershell-oracle/fixtures/VERSION'
