name: CI

# Prose-only changes skip the full battery; keep both lists identical.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "**/LICENSE"
      - "docs/**"
      - .coderabbit.yaml
      - .editorconfig
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/LICENSE"
      - "docs/**"
      - .coderabbit.yaml
      - .editorconfig

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: { contents: read }
env: { CARGO_TERM_COLOR: always }

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event.repository.visibility == 'public' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run -p dprint-plugin-pwsh --features schema --bin generate-schema
      - run: git diff --exit-code crates/dprint-plugin-pwsh/deployment/schema.json

  wasm:
    name: wasm builds + dprint e2e + node package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: latest }
      - uses: kjanat/install-dprint@v2
      - uses: cargo-bins/cargo-binstall@b629f84e79e8fbc4f76616a8efd340f3ea605cab # main, 2026-08-17
      - name: Install tools
        run: cargo binstall --no-confirm wasm-bindgen-cli --version 0.2.127 --locked
      - name: dprint plugin end-to-end
        run: crates/dprint-plugin-pwsh/tests/e2e.sh
      - name: Build and test the npm package
        working-directory: packages/formatter
        run: bash build.sh && npm test
      - name: Build and test the dprint npm package
        working-directory: packages/dprint-plugin
        run: bash build.sh && npm ci && npm test
      - name: Report artifact sizes and enforce budget
        run: |
          set -euo pipefail
          plugin='target/wasm32-unknown-unknown/wasm-release/dprint_plugin_pwsh.wasm'
          browser='packages/formatter/dist/pwsh_formatter_wasm_bg.wasm'
          for f in "${plugin}" "${browser}"; do
            raw="$(stat -c%s "${f}")"
            gz="$(gzip -9 -c "${f}" | wc -c)"
            echo "${f}: raw=${raw} gzip=${gz}"
            # Budget: hard-fail if a change balloons the artifact past 1 MB raw.
            if [[ "${raw}" -gt 1048576 ]]; then
              echo "size budget exceeded for ${f}" >&2
              exit 1
            fi
          done

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include: [
          { target: lexer, seconds: 30 },
          { target: parser, seconds: 30 },
          { target: formatter, seconds: 60 },
        ]
    runs-on: ubuntu-latest
    env: { target: "${{ matrix.target }}", seconds: "${{ matrix.seconds }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: ".\nfuzz" }
      - run: cargo install cargo-fuzz --locked
      - name: Seed fuzz corpus from the real-world corpus
        run: |
          mkdir -p "fuzz/corpus/${target}"
          for f in tests/corpus/files/*.ps1 tests/powershell-oracle/inputs/*.ps1; do
            # Include the source directory in the seed name: both corpus
            # directories contain overlapping basenames.
            b="$(tr '/' '_' <<<"${f%.ps1}")"
            cp "${f}" "fuzz/corpus/${target}/${b}"
          done
      - name: Short fuzz pass
        run: |
          echo "Running fuzz target '${target}' for ${seconds} seconds"
          echo "::group::${target}"
          cargo +nightly fuzz run "${target}" -- "-max_total_time=${seconds}"
          echo "::endgroup::"

  powershell-oracles:
    name: PowerShell + PSScriptAnalyzer oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          # Install exactly the build the committed expectations were
          # generated with, so parity fixtures cannot drift under us when
          # upstream ships a release.
          $version = (Get-Content tests/pssa-parity/expected/VERSION -Raw).Trim()
          Write-Host "pinned PSScriptAnalyzer: ${version}; PowerShell: $($PSVersionTable.PSVersion)"
          Install-Module PSScriptAnalyzer -RequiredVersion $version -Force -Scope CurrentUser
      - name: Regenerate oracle fixtures with this runner's PowerShell
        shell: pwsh
        run: |
          ./tests/powershell-oracle/generate.ps1
          ./tests/pssa-parity/generate.ps1
          ./tests/pssa-parity/generate-catalog.ps1
      - name: Differential tests against freshly generated fixtures
        run: |
          cargo test -p pwsh-parser    --test oracle
          cargo test -p pwsh-formatter --test pssa_parity
      - name: Fail if committed fixtures drifted from the pinned versions
        # --exit-code, or the step reports drift and passes anyway. The pwsh
        # VERSION stamp is excluded: the runner's patch release is not ours
        # to pin, and a real tokenizer change shows up as fixture content
        # (and fails the differential tests above) rather than as metadata.
        run: |
          git diff --exit-code --stat -- \
            tests/powershell-oracle/fixtures tests/pssa-parity/expected \
            ':(exclude)tests/powershell-oracle/fixtures/VERSION'
