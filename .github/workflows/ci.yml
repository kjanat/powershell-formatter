name: CI

on:
  push: { branches: [master] }
  pull_request: null

permissions: { contents: read }

env: { CARGO_TERM_COLOR: always }

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy,rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo run -p dprint-plugin-powershell --features schema --bin generate-schema
      - run: git diff --exit-code crates/dprint-plugin-powershell/deployment/schema.json

  wasm:
    name: wasm builds + dprint e2e + node package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: latest }
      - uses: kjanat/install-dprint@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install tools
        run: cargo binstall --no-confirm wasm-bindgen-cli --version 0.2.127 --locked
      - name: dprint plugin end-to-end
        run: crates/dprint-plugin-powershell/tests/e2e.sh
      - name: Build and test the npm package
        working-directory: packages/formatter
        run: bash build.sh && npm test
      - name: Report artifact sizes and enforce budget
        run: |
          set -euo pipefail
          plugin='target/wasm32-unknown-unknown/wasm-release/dprint_plugin_powershell.wasm'
          browser='packages/formatter/dist/powershell_formatter_wasm_bg.wasm'
          for f in "${plugin}" "${browser}"; do
            raw="$(stat -c%s "${f}")"
            gz="$(gzip -9 -c "${f}" | wc -c)"
            echo "${f}: raw=${raw} gzip=${gz}"
            # Budget: hard-fail if a change balloons the artifact past 1 MB raw.
            if [[ "${raw}" -gt 1048576 ]]; then
              echo "size budget exceeded for ${f}" >&2
              exit 1
            fi
          done

  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include: [
          { target: lexer, seconds: 30 },
          { target: parser, seconds: 30 },
          { target: formatter, seconds: 60 },
        ]
    runs-on: ubuntu-latest
    env: { target: "${{ matrix.target }}", seconds: "${{ matrix.seconds }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: ".\nfuzz" }
      - run: cargo install cargo-fuzz --locked
      - name: Seed fuzz corpus from the real-world corpus
        run: |
          mkdir -p "fuzz/corpus/${target}"
          for f in tests/corpus/files/*.ps1 tests/powershell-oracle/inputs/*.ps1; do
            b="$(basename "${f}" .ps1)"
            cp "${f}" "fuzz/corpus/${target}/${b}"
          done
      - name: Short fuzz pass
        run: |
          echo "Running fuzz target '${target}' for ${seconds} seconds"
          echo "::group::%s${target}"
          cargo +nightly fuzz run "${target}" -- "-max_total_time=${seconds}"
          echo "::endgroup::"

  powershell-oracles:
    name: PowerShell + PSScriptAnalyzer oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          (Get-Module -ListAvailable PSScriptAnalyzer).Version
      - name: Regenerate oracle fixtures with this runner's PowerShell
        shell: pwsh
        run: |
          ./tests/powershell-oracle/generate.ps1
          ./tests/pssa-parity/generate.ps1
          ./tests/pssa-parity/generate-catalog.ps1
      - name: Differential tests against freshly generated fixtures
        run: |
          cargo test -p powershell-parser    --test oracle
          cargo test -p powershell-formatter --test pssa_parity
      - name: Fail if committed fixtures drifted from the pinned versions
        run: git diff --stat -- tests/powershell-oracle/fixtures tests/pssa-parity/expected
