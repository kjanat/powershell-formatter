[package]
name       = "pwsh-formatter-fuzz"
version    = "0.2.0"
edition    = "2024"
readme     = "README.md"
keywords   = ["formatter", "fuzzing", "powershell", "testing"]
categories = ["development-tools::testing"]
publish    = false

[package.metadata]
cargo-fuzz = true

[[bin]]
bench = false
doc   = false
name  = "lexer"
path  = "fuzz_targets/lexer.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "parser"
path  = "fuzz_targets/parser.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "formatter"
path  = "fuzz_targets/formatter.rs"
test  = false

[dependencies]
libfuzzer-sys  = "0.4"
pwsh-formatter = { path = "../crates/pwsh-formatter" }
pwsh-parser    = { path = "../crates/pwsh-parser" }

[profile.release]
debug = 1
