[workspace]
resolver = "3"
members  = ["cli/psfmt", "crates/*"]
exclude  = ["fuzz"]

[workspace.package]
version      = "0.0.0"
authors      = ["Kaj Kowalski"]
edition      = "2024"
rust-version = "1.97"
repository   = "https://github.com/kjanat/powershell-formatter"
license      = "MIT"

# One place per version; members reference these with `workspace = true`.
[workspace.dependencies]
bitflags           = "2"
divan              = "0.1"
dprint-core        = { version = "0.68", features = ["wasm"] }
json-schema-sort   = { version = "0.1", default-features = false }
proptest           = "1"
schemars           = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde-wasm-bindgen = "0.6"

# Pinned exactly: the wasm-bindgen-cli used by packages/formatter/build.sh
wasm-bindgen = "=0.2.127"

# Workspace members, path for local builds + version for crates.io publish.
# The version strings track workspace.package.version — bump them together
# (the release workflow refuses a tag that disagrees with either).
pwsh-formatter = { path = "crates/pwsh-formatter", version = "0.0.0" }
pwsh-parser    = { path = "crates/pwsh-parser", version = "0.0.0" }

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true

# Size-optimized profile for Wasm artifacts: cold-load cost dominates a
# dprint plugin, so trade compile time for a smaller binary.
[profile.wasm-release]
inherits      = "release"
opt-level     = "z"
strip         = true
lto           = "fat"
panic         = "abort"
codegen-units = 1
