[workspace]
resolver = "3"
members  = ["cli/psfmt", "crates/*"]
exclude  = ["fuzz"]

[workspace.package]
version      = "0.0.0"
authors      = ["Kaj Kowalski"]
edition      = "2024"
rust-version = "1.97"
repository   = "https://github.com/kjanat/powershell-formatter"
license      = "MIT"

# One place per version; members reference these with `workspace = true`.
[workspace.dependencies]
powershell-formatter = { version = "0.0.0", path = "crates/powershell-formatter" }
powershell-parser    = { version = "0.0.0", path = "crates/powershell-parser" }

bitflags           = "2"
divan              = "0.1"
dprint-core        = { version = "0.68", features = ["wasm"] }
json-schema-sort   = { version = "0.1", default-features = false }
proptest           = "1"
schemars           = "1"
serde              = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json         = "1"
# Pinned exactly: the wasm-bindgen-cli used by packages/formatter/build.sh
# must match this version byte-for-byte.
wasm-bindgen       = "=0.2.127"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true

# Size-optimized profile for Wasm artifacts: cold-load cost dominates a
# dprint plugin, so trade compile time for a smaller binary.
[profile.wasm-release]
inherits      = "release"
opt-level     = "z"
strip         = true
lto           = "fat"
panic         = "abort"
codegen-units = 1
